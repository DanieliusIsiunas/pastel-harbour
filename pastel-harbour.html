<title>Pastel Harbour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D harbour, a small name card top-left and a floating build dock at the bottom. */
:root {
  --sea: #d9ecef;
  --ink: #2f3d45;
  --ink-soft: #5d6d75;
  --panel: rgba(255, 252, 247, 0.86);
  --line: rgba(47, 61, 69, 0.14);
  --accent: #e07a5f;
  --danger: #d4574a;
  --font-ui: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-ui); -webkit-user-select: none; user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }

.card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  max-width: min(320px, calc(100vw - 32px));
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
  display: grid;
  gap: 6px;
}
.card h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.card kbd { font-family: var(--font-ui); font-size: 11px; background: rgba(47,61,69,.08); border-radius: 5px; padding: 1px 5px; }
.count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: max-content;
  max-width: calc(100vw - 32px);
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 14px;
}
.swatches { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sw {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9);
  box-shadow: 0 0 0 1px var(--line);
  cursor: pointer; padding: 0;
  transition: transform .15s ease;
}
.sw:hover { transform: translateY(-2px); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--ink); transform: translateY(-2px); }
.sw.mixed { background: conic-gradient(#e8a3a0, #f5e6b8, #a8d5ba, #9cc5e3, #c7b3e6, #e8a3a0); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.seg { display: inline-flex; background: rgba(47,61,69,.07); border-radius: 12px; padding: 3px; }
button.t {
  font-family: var(--font-ui); font-size: 14px; font-weight: 500;
  color: var(--ink); background: transparent;
  border: 0; border-radius: 10px; padding: 7px 12px; cursor: pointer;
}
button.t:hover { background: rgba(47,61,69,.08); }
.seg button.t[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 3px rgba(47,61,69,.18); }
.seg button.t#m-erase[aria-pressed="true"] { color: var(--danger); }
button.t.warn { color: var(--danger); }
button.t:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 560px) {
  .card p.help { display: none; }
  .card { padding: 10px 14px; }
  .card h1 { font-size: 18px; }
  .sw { width: 26px; height: 26px; }
}
</style>

<canvas id="c" tabindex="0" aria-label="Harbour building area"></canvas>

<div class="card">
  <h1>Pastel Harbour</h1>
  <p class="help">Click the water to raise a house. Click a wall or roof to build onto it. Houses pick their own roofs, windows, doors and arches.</p>
  <p class="help"><kbd>Shift</kbd> or right-click removes · drag to orbit · scroll to zoom · <kbd>⌘Z</kbd> undo</p>
  <div class="count" id="count">0 blocks</div>
</div>

<div class="dock">
  <div class="swatches" id="swatches" role="radiogroup" aria-label="House colour"></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Tool">
      <button class="t" id="m-build" aria-pressed="true">Build</button>
      <button class="t" id="m-erase" aria-pressed="false">Erase</button>
    </div>
    <button class="t" id="undo" disabled>Undo</button>
    <button class="t" id="sample">New town</button>
    <button class="t" id="clear">Clear</button>
    <button class="t" id="sound" aria-pressed="true">Sound on</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- palette ----------
const PALETTE = [
  { name: 'Rose',   wall: '#e8a3a0', roof: '#8e4b55' },
  { name: 'Sand',   wall: '#f2d0a4', roof: '#b5563f' },
  { name: 'Butter', wall: '#f5e6b8', roof: '#c0654a' },
  { name: 'Mint',   wall: '#a8d5ba', roof: '#3f6b66' },
  { name: 'Sky',    wall: '#9cc5e3', roof: '#3d5878' },
  { name: 'Lilac',  wall: '#c7b3e6', roof: '#5b4a7a' },
  { name: 'Chalk',  wall: '#f4f1ec', roof: '#4f5d66' },
  { name: 'Ochre',  wall: '#e9b872', roof: '#8a4a2f' },
];
const ROOF_OF = Object.fromEntries(PALETTE.map(p => [p.wall, p.roof]));
const C = { stone: '#b9b2a6', stoneLip: '#d8d2c6', trim: '#fbf8f2', glass: '#41546b', wood: '#6b4a3a', flat: '#d9cdbd', leaf: '#6f9e5c', sea: '#7fc1cf' };

const GRID = 11, MAXY = 12;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// ---------- state ----------
let blocks = new Map();               // "x,y,z" -> { c: wallHex }
const keyOf = (x, y, z) => x + ',' + y + ',' + z;
const has = (x, y, z) => blocks.has(keyOf(x, y, z));
const history = [];
let colorChoice = 'mixed';
let mode = 'build';
let soundOn = true;
let anim = { key: null, start: 0, group: null };

function hash(x, y, z, i) {
  let h = Math.imul((x * 73856093) ^ (y * 19349663) ^ (z * 83492791) ^ (i * 2654435761), 1597334677);
  h ^= h >>> 15; h = Math.imul(h, 2246822519); h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#d9ecef');
scene.fog = new THREE.Fog('#d9ecef', 38, 95);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
camera.position.set(17, 15, 19);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.5, 1, 1);
controls.enableDamping = true;
controls.maxPolarAngle = 1.42;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

scene.add(new THREE.HemisphereLight('#fdf6ec', '#7fb2bf', 1.5));
const sun = new THREE.DirectionalLight('#fff1db', 2.4);
sun.position.set(12, 20, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// water
const waterGeo = new THREE.PlaneGeometry(140, 140, 100, 100).rotateX(-Math.PI / 2);
const waterBase = waterGeo.attributes.position.array.slice();
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({ color: C.sea, roughness: 0.35, metalness: 0.05, flatShading: true }));
water.position.y = -0.25;
water.receiveShadow = true;
scene.add(water);

const grid = new THREE.GridHelper(GRID * 2 + 1, GRID * 2 + 1, '#ffffff', '#ffffff');
grid.material.transparent = true;
grid.material.opacity = 0.16;
grid.position.y = -0.17;
scene.add(grid);

// ---------- shared geometry & materials ----------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const GABLE = (() => {           // triangle cross-section in XY, ridge along Z, base 1 wide, 0.5 tall
  const s = new THREE.Shape();
  s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 0.5); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false }).translate(0, 0, -0.5);
})();
const CYL = new THREE.CylinderGeometry(0.5, 0.5, 1, 14);
const matCache = new Map();
function mat(hex) {
  if (!matCache.has(hex)) matCache.set(hex, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.88, metalness: 0 }));
  return matCache.get(hex);
}
function shade(hex, k) { return '#' + new THREE.Color(hex).multiplyScalar(k).getHexString(); }

function part(parent, geo, m, sx, sy, sz, x, y, z) {
  const o = new THREE.Mesh(geo, m);
  o.scale.set(sx, sy, sz); o.position.set(x, y, z);
  parent.add(o);
  return o;
}

// ---------- block builder: every detail is decided from the neighbours ----------
function buildBlock(x, y, z, b) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const wall = mat(b.c), trim = mat(C.trim), glass = mat(C.glass);
  const supported = y === 0 || has(x, y - 1, z);
  const top = !has(x, y + 1, z);
  const r = i => hash(x, y, z, i);

  if (y === 0) {
    part(g, BOX, mat(C.stone), 1.08, 0.75, 1.08, 0, -0.375, 0);
    part(g, BOX, mat(C.stoneLip), 1.12, 0.07, 1.12, 0, -0.02, 0);
  }

  if (supported) {
    part(g, BOX, wall, 1, 1, 1, 0, 0.5, 0);
  } else {
    // floating block: a slab with corbels underneath reads as an arch or bridge
    part(g, BOX, wall, 1, 0.4, 1, 0, 0.8, 0);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      part(g, BOX, wall, 0.16, 0.22, 0.16, sx * 0.42, 0.49, sz * 0.42);
      part(g, BOX, wall, 0.3, 0.1, 0.3, sx * 0.35, 0.55, sz * 0.35);
    }
    part(g, BOX, mat(shade(b.c, 0.8)), 0.96, 0.03, 0.96, 0, 0.6, 0);
  }

  // facades
  const faces = DIRS.filter(([dx, dz]) => !has(x + dx, y, z + dz));
  if (supported && faces.length) {
    const doorIdx = y === 0 ? Math.floor(r(9) * faces.length) : -1;
    faces.forEach(([dx, dz], i) => {
      const f = new THREE.Group();
      f.position.set(dx * 0.5, 0, dz * 0.5);
      f.rotation.y = Math.atan2(dx, dz);
      g.add(f);
      if (i === doorIdx) {
        part(f, BOX, trim, 0.42, 0.7, 0.03, 0, 0.35, 0.012);
        part(f, BOX, mat(C.wood), 0.32, 0.62, 0.05, 0, 0.31, 0.02);
        part(f, BOX, mat(ROOF_OF[b.c] || C.wood), 0.5, 0.05, 0.16, 0, 0.75, 0.08);
        return;
      }
      const v = r(20 + i);
      if (v < 0.1) return;
      if (v < 0.55) {
        part(f, BOX, trim, 0.36, 0.46, 0.03, 0, 0.56, 0.012);
        part(f, BOX, glass, 0.26, 0.36, 0.04, 0, 0.57, 0.02);
        part(f, BOX, trim, 0.44, 0.05, 0.09, 0, 0.32, 0.04);
        if (r(30 + i) > 0.6) part(f, BOX, mat(C.leaf), 0.34, 0.08, 0.09, 0, 0.375, 0.06);
      } else if (v < 0.8) {
        for (const s of [-1, 1]) {
          part(f, BOX, trim, 0.22, 0.42, 0.03, s * 0.21, 0.56, 0.012);
          part(f, BOX, glass, 0.14, 0.32, 0.04, s * 0.21, 0.57, 0.02);
        }
        part(f, BOX, trim, 0.7, 0.05, 0.08, 0, 0.33, 0.035);
      } else if (v < 0.92) {
        part(f, BOX, trim, 0.3, 0.44, 0.03, 0, 0.56, 0.012);
        part(f, BOX, glass, 0.22, 0.36, 0.04, 0, 0.56, 0.02);
        for (const s of [-1, 1]) part(f, BOX, mat(shade(b.c, 0.72)), 0.12, 0.42, 0.03, s * 0.23, 0.56, 0.025);
      } else {
        const ring = part(f, CYL, trim, 0.32, 0.03, 0.32, 0, 0.58, 0.012); ring.rotation.x = Math.PI / 2;
        const pane = part(f, CYL, glass, 0.24, 0.04, 0.24, 0, 0.58, 0.02); pane.rotation.x = Math.PI / 2;
      }
    });
  }

  // roof: pitched along runs of same-height houses, flat where they form a block
  if (top) {
    const nt = (dx, dz) => (has(x + dx, y, z + dz) && !has(x + dx, y + 1, z + dz)) ? 1 : 0;
    const ax = nt(1, 0) + nt(-1, 0), az = nt(0, 1) + nt(0, -1);
    const roofM = mat(ROOF_OF[b.c] || '#7a5a4a');
    if (ax > 0 && az > 0 && ax + az >= 3) {
      part(g, BOX, mat(C.flat), 1, 0.06, 1, 0, 1.03, 0);
      for (const [dx, dz] of DIRS) {
        if (nt(dx, dz)) continue;
        part(g, BOX, wall, dx ? 0.08 : 1, 0.16, dz ? 0.08 : 1, dx * 0.46, 1.08, dz * 0.46);
      }
      if (r(5) < 0.25) part(g, BOX, mat(C.stone), 0.18, 0.3, 0.18, (r(6) - 0.5) * 0.5, 1.2, (r(7) - 0.5) * 0.5);
    } else {
      const alongX = ax > az || (ax === az && r(3) < 0.5);
      const rg = new THREE.Group();
      rg.position.y = 1;
      if (alongX) rg.rotation.y = Math.PI / 2;
      g.add(rg);
      part(rg, GABLE, wall, 1, 1, 1, 0, 0, 0);
      for (const s of [-1, 1]) {
        const slab = part(rg, BOX, roofM, 0.8, 0.07, 1.1, s * 0.27, 0.28, 0);
        slab.rotation.z = -s * Math.PI / 4;
      }
      part(rg, BOX, mat(shade(ROOF_OF[b.c] || '#7a5a4a', 0.8)), 0.1, 0.08, 1.1, 0, 0.53, 0);
      if (r(4) < 0.35) {
        const s = r(8) < 0.5 ? -1 : 1;
        part(rg, BOX, mat(C.stone), 0.14, 0.42, 0.14, s * 0.22, 0.42, (r(11) - 0.5) * 0.6);
      }
    }
  }
  return g;
}

// ---------- rebuild: bake everything into instanced meshes (few draw calls) ----------
const baked = new THREE.Group(); scene.add(baked);
const animGroup = new THREE.Group(); scene.add(animGroup);
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false });
let hitMesh = null, hitKeys = [];

function rebuild() {
  for (const m of baked.children) m.dispose();
  baked.clear(); animGroup.clear(); anim.group = null;
  const buckets = new Map();
  for (const [k, b] of blocks) {
    const [x, y, z] = k.split(',').map(Number);
    const g = buildBlock(x, y, z, b);
    if (k === anim.key) {
      g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
      animGroup.add(g); anim.group = g; continue;
    }
    g.updateMatrixWorld(true);
    g.traverse(o => {
      if (!o.isMesh) return;
      const id = o.geometry.uuid + o.material.uuid;
      let bk = buckets.get(id);
      if (!bk) buckets.set(id, bk = { geo: o.geometry, mat: o.material, ms: [] });
      bk.ms.push(o.matrixWorld.clone());
    });
  }
  for (const bk of buckets.values()) {
    const im = new THREE.InstancedMesh(bk.geo, bk.mat, bk.ms.length);
    bk.ms.forEach((m, i) => im.setMatrixAt(i, m));
    im.castShadow = im.receiveShadow = true;
    im.frustumCulled = false;
    baked.add(im);
  }
  if (hitMesh) { scene.remove(hitMesh); hitMesh.dispose(); }
  hitKeys = [...blocks.keys()];
  hitMesh = new THREE.InstancedMesh(BOX, hitMat, Math.max(1, hitKeys.length));
  hitMesh.count = hitKeys.length;
  const m4 = new THREE.Matrix4();
  hitKeys.forEach((k, i) => { const [x, y, z] = k.split(',').map(Number); hitMesh.setMatrixAt(i, m4.makeTranslation(x, y + 0.5, z)); });
  hitMesh.computeBoundingSphere();
  scene.add(hitMesh);
  document.getElementById('count').textContent = blocks.size + (blocks.size === 1 ? ' block' : ' blocks');
  document.getElementById('undo').disabled = history.length === 0;
}

// ---------- persistence & history ----------
const STORE = 'pastel-harbour-v1';
function save() { try { localStorage.setItem(STORE, JSON.stringify([...blocks])); } catch (e) {} }
function load() { try { const s = localStorage.getItem(STORE); if (s) { const m = new Map(JSON.parse(s)); if (m.size) return m; } } catch (e) {} return null; }
function commit(fn) {
  history.push(JSON.stringify([...blocks]));
  if (history.length > 100) history.shift();
  fn(); save(); rebuild();
}
function undo() {
  if (!history.length) return;
  blocks = new Map(JSON.parse(history.pop()));
  anim.key = null; save(); rebuild(); pop(240, 0.6);
}

// ---------- sample town ----------
function sampleTown(seed) {
  const m = new Map(), rnd = mulberry32(seed);
  const pick = () => PALETTE[Math.floor(rnd() * PALETTE.length)].wall;
  const isles = [
    { cx: -2, cz: -1, r: 3.8, h: 4 },
    { cx: 5, cz: 2, r: 2.7, h: 3 },
    { cx: -4, cz: 6, r: 2.3, h: 2 },
  ];
  for (const s of isles) {
    for (let x = s.cx - 5; x <= s.cx + 5; x++) for (let z = s.cz - 5; z <= s.cz + 5; z++) {
      const d = Math.hypot(x - s.cx, z - s.cz) + (rnd() - 0.5) * 1.4;
      if (d >= s.r || Math.abs(x) > GRID || Math.abs(z) > GRID) continue;
      let H = Math.max(1, Math.round(s.h * (1 - d / s.r) + rnd() * 1.2));
      if (x === s.cx && z === s.cz) H = s.h + 2;
      let c = pick();
      for (let y = 0; y < H; y++) { if (rnd() < 0.25) c = pick(); m.set(keyOf(x, y, z), { c }); }
    }
  }
  // a bridge between the two big islands, and a small one to the third
  for (let x = -2; x <= 5; x++) if (!m.has(keyOf(x, 1, 1))) m.set(keyOf(x, 1, 1), { c: '#f4f1ec' });
  for (let z = -1; z <= 6; z++) if (!m.has(keyOf(-3, 1, z))) m.set(keyOf(-3, 1, z), { c: '#f2d0a4' });
  return m;
}

// ---------- boats ----------
const boats = [];
function makeBoat(color, radius, speed, phase) {
  const b = new THREE.Group();
  part(b, BOX, mat(C.wood), 0.9, 0.18, 0.36, 0, 0.09, 0);
  part(b, BOX, mat(color), 0.94, 0.06, 0.4, 0, 0.2, 0);
  part(b, BOX, mat(C.trim), 0.04, 0.7, 0.04, 0.05, 0.55, 0);
  const sail = part(b, GABLE, mat(C.trim), 0.02, 1.1, 0.7, 0.05, 0.25, 0.1);
  sail.rotation.y = Math.PI / 2;
  b.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(b);
  boats.push({ b, radius, speed, phase });
}
makeBoat('#e8a3a0', 14, 0.05, 0);
makeBoat('#9cc5e3', 16.5, -0.035, 2.4);

// ---------- sound ----------
let ac = null;
function pop(freq, gain = 1) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.7, t + 0.07);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14 * gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.22);
  } catch (e) {}
}

// ---------- picking ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const valid = t => Math.abs(t.x) <= GRID && Math.abs(t.z) <= GRID && t.y >= 0 && t.y < MAXY && !has(t.x, t.y, t.z);

function pick(cx, cy, erase) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  let best = null;
  if (hitKeys.length) {
    const hs = ray.intersectObject(hitMesh, false);
    if (hs.length) {
      const h = hs[0], [x, y, z] = hitKeys[h.instanceId].split(',').map(Number), n = h.face.normal;
      best = { d: h.distance, x, y, z, nx: Math.round(n.x), ny: Math.round(n.y), nz: Math.round(n.z) };
    }
  }
  if (erase) return best ? { erase: true, x: best.x, y: best.y, z: best.z } : null;
  const p = new THREE.Vector3();
  const pd = ray.ray.intersectPlane(ground, p) ? ray.ray.origin.distanceTo(p) : Infinity;
  if (best && best.d <= pd) {
    const t = { x: best.x + best.nx, y: best.y + best.ny, z: best.z + best.nz };
    return valid(t) ? t : null;
  }
  if (pd < Infinity) {
    const t = { x: Math.round(p.x), y: 0, z: Math.round(p.z) };
    return valid(t) ? t : null;
  }
  return null;
}

const ghostMat = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.4, depthWrite: false });
const ghost = new THREE.Mesh(BOX, ghostMat);
ghost.visible = false;
scene.add(ghost);

function colorForPlacement() {
  if (colorChoice !== 'mixed') return colorChoice;
  return PALETTE[Math.floor(Math.random() * PALETTE.length)].wall;
}
let nextMixed = colorForPlacement();

function act(cx, cy, erase) {
  const t = pick(cx, cy, erase);
  if (!t) return;
  if (t.erase) {
    commit(() => blocks.delete(keyOf(t.x, t.y, t.z)));
    pop(180, 0.8);
  } else {
    const c = colorChoice === 'mixed' ? nextMixed : colorChoice;
    nextMixed = colorForPlacement();
    anim = { key: keyOf(t.x, t.y, t.z), start: performance.now(), group: null };
    commit(() => blocks.set(anim.key, { c }));
    pop(320 + t.y * 55);
  }
  updateGhost();
}

// ---------- input ----------
let down = null, lastPointer = null, shiftHeld = false;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, b: e.button }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), b = down.b;
  down = null;
  if (moved > 6) return;
  act(e.clientX, e.clientY, mode === 'erase' || e.shiftKey || b === 2);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointermove', e => { lastPointer = { x: e.clientX, y: e.clientY, touch: e.pointerType === 'touch' }; shiftHeld = e.shiftKey; updateGhost(); });
canvas.addEventListener('pointerleave', () => { lastPointer = null; ghost.visible = false; });
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Shift') { shiftHeld = true; updateGhost(); }
});
addEventListener('keyup', e => { if (e.key === 'Shift') { shiftHeld = false; updateGhost(); } });

function updateGhost() {
  if (!lastPointer || lastPointer.touch || down) { ghost.visible = false; return; }
  const erase = mode === 'erase' || shiftHeld;
  const t = pick(lastPointer.x, lastPointer.y, erase);
  if (!t) { ghost.visible = false; return; }
  ghost.visible = true;
  ghost.position.set(t.x, t.y + 0.5, t.z);
  ghost.scale.setScalar(erase ? 1.06 : 1.0);
  ghostMat.color.set(erase ? '#d4574a' : (colorChoice === 'mixed' ? nextMixed : colorChoice));
  ghostMat.opacity = erase ? 0.45 : 0.42;
}

// ---------- UI ----------
const swWrap = document.getElementById('swatches');
function addSwatch(value, label, cls, bg) {
  const s = document.createElement('button');
  s.className = 'sw' + (cls ? ' ' + cls : '');
  s.id = 'sw-' + label.toLowerCase();
  s.setAttribute('role', 'radio');
  s.setAttribute('aria-label', label);
  s.title = label;
  if (bg) s.style.background = bg;
  s.addEventListener('click', () => {
    colorChoice = value;
    nextMixed = colorForPlacement();
    swWrap.querySelectorAll('.sw').forEach(n => n.setAttribute('aria-checked', String(n === s)));
    setMode('build');
  });
  s.setAttribute('aria-checked', String(value === colorChoice));
  swWrap.appendChild(s);
}
addSwatch('mixed', 'Mixed', 'mixed');
PALETTE.forEach(p => addSwatch(p.wall, p.name, '', p.wall));

function setMode(m) {
  mode = m;
  document.getElementById('m-build').setAttribute('aria-pressed', String(m === 'build'));
  document.getElementById('m-erase').setAttribute('aria-pressed', String(m === 'erase'));
  updateGhost();
}
document.getElementById('m-build').onclick = () => setMode('build');
document.getElementById('m-erase').onclick = () => setMode('erase');
document.getElementById('undo').onclick = undo;
document.getElementById('sample').onclick = () => {
  commit(() => { blocks = sampleTown((Math.random() * 1e9) | 0); });
  pop(420); setTimeout(() => pop(560), 90);
};
const clearBtn = document.getElementById('clear');
let clearTimer = null;
clearBtn.onclick = () => {
  if (!clearTimer) {
    clearBtn.textContent = 'Tap again to clear';
    clearBtn.classList.add('warn');
    clearTimer = setTimeout(() => { clearBtn.textContent = 'Clear'; clearBtn.classList.remove('warn'); clearTimer = null; }, 2500);
    return;
  }
  clearTimeout(clearTimer); clearTimer = null;
  clearBtn.textContent = 'Clear'; clearBtn.classList.remove('warn');
  commit(() => blocks.clear());
};
const soundBtn = document.getElementById('sound');
soundBtn.onclick = () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
};

// ---------- loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const pos = waterGeo.attributes.position;
let frame = 0;

function tick(now) {
  const t = now / 1000;
  if (!reduceMotion && (frame++ & 1) === 0) {
    const a = pos.array;
    for (let i = 0; i < a.length; i += 3) {
      const x = waterBase[i], z = waterBase[i + 2];
      a[i + 1] = Math.sin(x * 0.55 + t * 0.9) * 0.05 + Math.cos(z * 0.45 + t * 0.7) * 0.05 + Math.sin((x + z) * 1.3 + t * 1.6) * 0.015;
    }
    pos.needsUpdate = true;
    waterGeo.computeVertexNormals();
  }
  for (const bt of boats) {
    const ang = bt.phase + t * bt.speed;
    bt.b.position.set(Math.cos(ang) * bt.radius, -0.2 + Math.sin(t * 1.3 + bt.phase) * 0.05, Math.sin(ang) * bt.radius);
    bt.b.rotation.y = -ang + (bt.speed > 0 ? 0 : Math.PI);
    bt.b.rotation.z = Math.sin(t * 1.1 + bt.phase) * 0.06;
  }
  if (anim.group) {
    const p = Math.min(1, (now - anim.start) / (reduceMotion ? 1 : 380));
    const s = Math.max(0.001, easeOutBack(p));
    anim.group.scale.set(1 + (1 - s) * 0.15, s, 1 + (1 - s) * 0.15);
    if (p >= 1) { anim.key = null; rebuild(); }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

blocks = load() || sampleTown(20261025);
rebuild();
requestAnimationFrame(tick);
</script>
