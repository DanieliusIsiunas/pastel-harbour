<title>Pastel Harbour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed 3D harbour, a small name card top-left and a floating build dock at the bottom. */
:root {
  --sea: #d9ecef;
  --ink: #2f3d45;
  --ink-soft: #5d6d75;
  --panel: rgba(255, 252, 247, 0.86);
  --line: rgba(47, 61, 69, 0.14);
  --accent: #e07a5f;
  --danger: #d4574a;
  --font-ui: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-ui); -webkit-user-select: none; user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20, 40, 60, 0.18) 100%); }

.card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  max-width: min(320px, calc(100vw - 32px));
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
  display: grid;
  gap: 6px;
  transition: opacity .3s ease;
}
.card h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.card kbd { font-family: var(--font-ui); font-size: 11px; background: rgba(47,61,69,.08); border-radius: 5px; padding: 1px 5px; }
.count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: max-content;
  max-width: calc(100vw - 32px);
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 14px;
}
.swatches { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sw {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9);
  box-shadow: 0 0 0 1px var(--line);
  cursor: pointer; padding: 0;
  transition: transform .15s ease;
}
.sw:hover { transform: translateY(-2px); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--ink); transform: translateY(-2px); }
.sw.mixed { background: conic-gradient(#e8a3a0, #f5e6b8, #a8d5ba, #9cc5e3, #c7b3e6, #e8a3a0); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.seg { display: inline-flex; background: rgba(47,61,69,.07); border-radius: 12px; padding: 3px; }
button.t {
  font-family: var(--font-ui); font-size: 14px; font-weight: 500;
  color: var(--ink); background: transparent;
  border: 0; border-radius: 10px; padding: 7px 11px; cursor: pointer;
}
button.t:hover { background: rgba(47,61,69,.08); }
.seg button.t[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 3px rgba(47,61,69,.18); }
.seg button.t#m-erase[aria-pressed="true"] { color: var(--danger); }
button.t.warn { color: var(--danger); }
button.t:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 560px) {
  .card p.help { display: none; }
  .card { padding: 10px 14px; }
  .card h1 { font-size: 18px; }
  .sw { width: 26px; height: 26px; }
  button.t { padding: 6px 8px; font-size: 13px; }
}
</style>

<canvas id="c" tabindex="0" aria-label="Harbour building area"></canvas>
<div class="vignette"></div>

<div class="card">
  <h1>Pastel Harbour</h1>
  <p class="help">Click the water to lay a cobbled street. Click a street to raise a house on it, or a wall or roof to build onto it. Roofs, windows, arches and gardens arrange themselves.</p>
  <p class="help"><kbd>Shift</kbd> or right-click removes · drag to orbit · scroll to zoom · <kbd>⌘Z</kbd> undo · <kbd>T</kbd> time of day</p>

</div>

<div class="dock">

    <button class="t" id="clear">Clear</button>
    <button class="t" id="sound" aria-pressed="true">Sound on</button>
  </div>
</div>

const GRID = generateGrid(GRID_SEED, HEX_N, TRI_SIDE);

// vertex topology: houses live on grid corners (Townscaper's dual grid)
const VERTS = GRID.V;

const IRON2 = '#33373d';

  wb(F, leg0 - 0.02, L + 0.02, -0.09, 0.02, WATER - 0.05, WATER + 0.06, lin(C.stone));
  const mid = (base + y) / 2;
  wb(F, 0, leg0, -0.05, -0.02, mid - 0.02, mid + 0.02, iron);          // a horizontal tie
  wseg(F, leg0, base + 0.25, 0.02, mid - 0.02, -0.05, -0.025, 0.025, iron);   // and bracing
  wseg(F, leg0, mid + 0.02, 0.02, y - 0.12, -0.05, -0.025, 0.025, iron);

function emitWall(cell, y, s, v, b, supported, vv) {

const fxPos = new Float32Array(FX_N * 3), fxCol = new Float32Array(FX_N * 3), fxSize = new Float32Array(FX_N), fxAlpha = new Float32Array(FX_N);
const fxState = Array.from({ length: FX_N }, () => ({ life: 0, max: 1, vx: 0, vy: 0, vz: 0, kind: 0, size: 0.1, ph: 0 }));
const fxGeo = new THREE.BufferGeometry();
fxGeo.setAttribute('position', new THREE.BufferAttribute(fxPos, 3));
fxGeo.setAttribute('fxColor', new THREE.BufferAttribute(fxCol, 3));
fxGeo.setAttribute('size', new THREE.BufferAttribute(fxSize, 1));
fxGeo.setAttribute('alpha', new THREE.BufferAttribute(fxAlpha, 1));
const fxMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uScale: { value: 500 } },
  vertexShader: `attribute float size; attribute float alpha; attribute vec3 fxColor; uniform float uScale; varying vec3 vC; varying float vA;
void main() { vC = fxColor; vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = size * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying vec3 vC; varying float vA;
void main() { float r = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, r); float core = smoothstep(0.18, 0.0, r); gl_FragColor = vec4(vC + core * 0.35, a * vA); }`,
});
const fx = new THREE.Points(fxGeo, fxMat);
fx.frustumCulled = false;
fx.renderOrder = 3;
scene.add(fx);
let fxNext = 0;
const fxTmp = new THREE.Color();
function spawn(kind, x, y, z, vx, vy, vz, life, size, hex) {
  fxIdle = false;
  const i = fxNext; fxNext = (fxNext + 1) % FX_N;
  const st = fxState[i];
  Object.assign(st, { life: 0, max: life, vx, vy, vz, kind, size, ph: Math.random() * 6.28 });
  fxPos[i * 3] = x; fxPos[i * 3 + 1] = y; fxPos[i * 3 + 2] = z;
  fxTmp.set(hex);

function sparkleAt(x, y, z, n) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, r = Math.random() * 0.25;
    spawn(1, x + Math.cos(a) * r, y + Math.random() * 0.2, z + Math.sin(a) * r, Math.cos(a) * 0.15, 0.5 + Math.random() * 0.6, Math.sin(a) * 0.15, 0.7 + Math.random() * 0.5, 0.06 + Math.random() * 0.04, Math.random() < 0.6 ? '#ffd98a' : '#fff6dc');
  }
}
// the burst that greets each click: a dust ring, rising sparkles, and rings on the water for streets
function burst(rg) {

  const [x, z] = VERTS[rg.v], y = rg.y === 0 ? GROUND : rg.y;
  const dust = rg.erase ? '#e6ddd0' : '#f6f0e4';
  const n = rg.erase ? 26 : 18;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.28 + Math.random() * 0.3, sp = 0.6 + Math.random() * 0.6;
    const yy = rg.erase ? y + Math.random() * 0.8 : y + 0.04;

  }
  if (!rg.erase) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.28, r = Math.random() * 0.4;
      spawn(1, x + Math.cos(a) * r, y + Math.random() * 0.9, z + Math.sin(a) * r, Math.cos(a) * 0.25, 0.7 + Math.random() * 0.9, Math.sin(a) * 0.25, 0.8 + Math.random() * 0.6, 0.06 + Math.random() * 0.05, Math.random() < 0.65 ? '#ffd98a' : '#fff6dc');
    }

}
const rings = [];
const ringGeo = new THREE.RingGeometry(0.92, 1, 64).rotateX(-Math.PI / 2);
function waterRing(x, z, delay) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, depthWrite: false }));
  m.position.set(x, WATER + 0.02, z);
  m.renderOrder = 2;
  scene.add(m);

}
let fxIdle = false;
function updateFx(dt, t) {
  if (fxIdle && !rings.length) return;
  let alive = 0;
  for (let i = 0; i < FX_N; i++) {
    const st = fxState[i];
    if (st.life >= st.max) { fxAlpha[i] = 0; continue; }
    alive++;
    st.life += dt;
    const p = Math.min(1, st.life / st.max);
    if (st.kind === 0) {
      st.vx *= 0.9; st.vz *= 0.9; st.vy = st.vy * 0.94 + 0.02;
      fxAlpha[i] = 0.5 * Math.pow(1 - p, 1.6);
      fxSize[i] = st.size * (1 + p * 1.8);
    } else {
      st.vx *= 0.97; st.vz *= 0.97; st.vy *= 0.96;
      fxAlpha[i] = (1 - p) * (0.55 + 0.45 * Math.sin(st.life * 26 + st.ph));
      fxSize[i] = st.size * (1 - p * 0.4);

    fxPos[i * 3] += st.vx * dt; fxPos[i * 3 + 1] += st.vy * dt; fxPos[i * 3 + 2] += st.vz * dt;

  fxGeo.attributes.size.needsUpdate = true;
  fxGeo.attributes.alpha.needsUpdate = true;
  fxGeo.attributes.fxColor.needsUpdate = true;

  const now = performance.now();
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], p = (now - r.start) / 1100;
    if (p < 0) continue;
    if (p >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - p, 3);
    r.m.scale.setScalar(0.45 + e * 1.9);
    r.m.material.opacity = 0.55 * (1 - p);

}

// ---------- sound ----------
let ac = null, amb = null;

    const a = audio(), t = a.currentTime;

    g.gain.exponentialRampToValueAtTime(0.0001, t + (erase ? 0.25 : 0.6));

}

      const t = a.currentTime + 0.05 + i * 0.045, o = a.createOscillator(), g = a.createGain();

      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

// ---------- picking ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(WATER + 0.1));
const valid = (v, y) => v >= 0 && !vFixed[v] && y >= 0 && y < MAXY && !has(v, y);

function pick(cx, cy, erase) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  const pd = ray.ray.intersectPlane(ground, p) ? ray.ray.origin.distanceTo(p) : Infinity;
  if (pd < Infinity) gridMat.uniforms.uCursor.value.copy(p);
  let hit = null;
  if (pickMesh) {
    const hs = ray.intersectObject(pickMesh, false);
    if (hs.length) hit = { d: hs[0].distance, m: pickMeta[hs[0].faceIndex], pt: hs[0].point };
  }
  if (erase) return hit ? { erase: true, v: hit.m.v, y: hit.m.y } : null;
  if (hit && hit.d <= pd + 1e-3) {
    const { v, y, t, cands } = hit.m;
    if (t === 'top') return valid(v, y + 1) ? { v, y: y + 1 } : null;
    if (t === 'bottom') return valid(v, y - 1) ? { v, y: y - 1 } : null;
    let best = -1, bd = Infinity;
    for (const c of cands) {
      const d = (VERTS[c][0] - hit.pt.x) ** 2 + (VERTS[c][1] - hit.pt.z) ** 2;
      if (d < bd && valid(c, y)) { bd = d; best = c; }
    }
    return best >= 0 ? { v: best, y } : null;
  }
  if (pd < Infinity) {
    const v = vertexAt(p.x, p.z);
    return valid(v, 0) ? { v, y: 0 } : null;
  }
  return null;
}

// hover ghost shaped like the house footprint around the corner
const ghostMat = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.4, depthWrite: false });

const ghost = new THREE.Group(); scene.add(ghost);
let ghostKey = '', ghostBase = 0.32, ghostFade = 1;
function setGhost(t, erase) {
  const key = t ? t.v + ':' + t.y + ':' + erase : '';
  if (key === ghostKey) return;
  ghostKey = key;
  disposeGroup(ghost); ghost.clear();
  if (!t) return;
  const prev = M;
  M = newMesh();
  const lp = [], y0 = t.y - (erase ? 0.03 : 0), y1 = t.y + 1 + (erase ? 0.03 : 0);
  for (const [ci, k] of vCells[t.v]) {
    const cell = cells[ci], V = cell.q[k];
    const a = xz(cell, UVM[k][0], UVM[k][1]), c = xz(cell, 0.5, 0.5), d = xz(cell, UVM[pv4(k)][0], UVM[pv4(k)][1]);
    const ref = [V[0], (y0 + y1) / 2, V[1]];
    face('main', [P3(a, y1), P3(c, y1), P3(d, y1), P3(V, y1)], [1, 1, 1], ref);
    face('main', [P3(a, y0), P3(c, y0), P3(c, y1), P3(a, y1)], [1, 1, 1], ref);
    face('main', [P3(c, y0), P3(d, y0), P3(d, y1), P3(c, y1)], [1, 1, 1], ref);
    for (const yy of [y0 + 0.01, y1]) lp.push(a[0], yy, a[1], c[0], yy, c[1], c[0], yy, c[1], d[0], yy, d[1]);
    lp.push(c[0], y0, c[1], c[0], y1, c[1]);
  }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(M.main.p, 3));

  const gm = new THREE.Mesh(geo, ghostMat);
  WINFX.add(gm);
  ghost.add(gm);
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  const gl2 = new THREE.LineSegments(lg, ghostLineMat);
  WINFX.add(gl2);
  ghost.add(gl2);
  const under = blocks.get(keyOf(t.v, t.y - 1));
  const mixedCol = t.y >= 2 && under ? under.c : nextMixed;
  ghostMat.color.set(erase ? '#d4574a' : (colorChoice === 'mixed' ? mixedCol : colorChoice));
  ghostBase = erase ? 0.45 : 0.32;
  ghostFade = 0;
  ghostLineMat.color.set(erase ? '#d4574a' : '#ffffff');

function colorForPlacement() {
  if (colorChoice !== 'mixed') return colorChoice;
  return PALETTE[Math.floor(Math.random() * PALETTE.length)].wall;
}
let nextMixed = colorForPlacement();

function act(cx, cy, erase) {
  const t = pick(cx, cy, erase);
  if (!t) return;
  if (t.erase) {
    regen = { v: t.v, y: t.y, erase: true };
    commit(() => blocks.delete(keyOf(t.v, t.y)));
    pluck(t.y, true, 0.7);
    poof();
  } else {
    // in Mixed mode a new floor keeps the colour of the floor it stands on, so buildings stay whole
    const below = blocks.get(keyOf(t.v, t.y - 1));
    const c = colorChoice !== 'mixed' ? colorChoice : (t.y >= 2 && below ? below.c : nextMixed);
    nextMixed = colorForPlacement();
    regen = { v: t.v, y: t.y, erase: false };
    commit(() => blocks.set(keyOf(t.v, t.y), { c }));
    pluck(t.y);
    chime();
  }
  ghostKey = '';
  updateGhost();
}

// ---------- input ----------
let down = null, lastPointer = null, shiftHeld = false;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, b: e.button }; startAmbient(); });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), b = down.b;
  down = null;
  if (moved > 6) return;
  act(e.clientX, e.clientY, mode === 'erase' || e.shiftKey || b === 2);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (!mod && e.key.toLowerCase() === 't') cycleTime();
  if (e.key === 'Shift') { shiftHeld = true; updateGhost(); }
});
addEventListener('keyup', e => { if (e.key === 'Shift') { shiftHeld = false; updateGhost(); } });

function updateGhost() {
  if (!lastPointer || lastPointer.touch || down) { setGhost(null); return; }
  const erase = mode === 'erase' || shiftHeld;
  setGhost(pick(lastPointer.x, lastPointer.y, erase), erase);
}

// ---------- M3: time of day ----------
const TIMES = {
  Day:   { top: '#6f9fa9', horizon: '#86b1b8', sun: '#ffe4c0', sunI: 3.1, sunPos: [14, 22, 9],  hs: '#fff1df', hg: '#4f838d', hI: 1.6, water: '#478893', glow: 0,   glass: '#41546b', bloom: 0.0, foam: 0.55, foamCol: '#ffffff' },
  Dusk:  { top: '#6d78b3', horizon: '#f7c59f', sun: '#ffad73', sunI: 1.9, sunPos: [26, 8, -6],  hs: '#f6cbb2', hg: '#56698a', hI: 1.0, water: '#86a3cc', glow: 0.9, glass: '#ffcf8a', bloom: 0.35, foam: 0.5, foamCol: '#ffe6d6' },
  Night: { top: '#0b1430', horizon: '#2a3c66', sun: '#a9c1ff', sunI: 1.0, sunPos: [-12, 20, 10], hs: '#6074a8', hg: '#1a2647', hI: 1.0, water: '#1f3659', glow: 1.7, glass: '#ffd38f', bloom: 0.55, foam: 0.35, foamCol: '#7f90b8' },

let timeFrom = null, timeTo = null, timeStart = 0;

  document.getElementById('time').textContent = timeName;
  timeFrom = { ...cur, top: cur.top.clone(), horizon: cur.horizon.clone(), sun: cur.sun.clone(), hs: cur.hs.clone(), hg: cur.hg.clone(), water: cur.water.clone(), glass: cur.glass.clone(), foamCol: cur.foamCol.clone(), sunPos: cur.sunPos.clone() };

const _roomGlow = new THREE.Color(2.4, 1.55, 0.7);

  sky.material.uniforms.horizon.value.copy(cur.horizon);

// ---------- post-processing ----------
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4, stencilBuffer: true });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
// soft contact shadows in the creases: roof against wall, wall against street, under eaves and arches
const lowPower = matchMedia('(pointer: coarse)').matches;
let gtao = null;
if (!lowPower) {
  gtao = new GTAOPass(scene, camera, 1, 1);
  const hideAll = gtao.overrideVisibility.bind(gtao);
  gtao.overrideVisibility = () => { hideAll(); for (const m of WINFX) m.visible = false; };
  gtao.blendIntensity = 0.9;
  gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.3, thickness: 1.2, scale: 1.25, samples: 10 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 4, rings: 2, samples: 8 });
  composer.addPass(gtao);
}
window.harbourAO = on => { if (gtao) gtao.enabled = on; };
// dev helper for building precise test scenes from the console
window.harbourDev = {
  vertexAt: (x, z) => vertexAt(x, z, 2), neighbors: v => vAdj[v].slice(), pos: v => VERTS[v],
  build: list => commit(() => { for (const [v, y, c] of list) blocks.set(keyOf(v, y), { c: c || '#e8a3a0' }); }),
  clear: () => commit(() => blocks.clear()),
  bricks: on => { brickMat.visible = on; },
  rooms: on => { maskMat.visible = roomLitMat.visible = roomDarkMat.visible = on; },
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
  // what the planner placed, why, and anything the validator found illogical
  plan: () => {
    const counts = {};
    for (const e of PLAN.log) counts[e.kind] = (counts[e.kind] || 0) + 1;
    const types = {};
    for (const h of houses) types[h.type] = (types[h.type] || 0) + 1;
    return { counts, houseTypes: types, issues: PLAN.issues.slice(0, 20), sample: PLAN.log.slice(0, 8) };
  },
  why: v => PLAN.log.filter(e => e.at.startsWith(v + '>') || e.at === 'tile ' + v || e.at.startsWith('edge ' + v + '~')),
  toggle: { shadows: on => { renderer.shadowMap.autoUpdate = on; }, bloom: on => { bloom.enabled = on; }, reflection: on => { water.visible = on; } },
  count: () => { let tris = 0, inst = 0; townObj.traverse(o => { if (o.isInstancedMesh) inst += o.count; else if (o.isMesh) tris += o.geometry.attributes.position.count / 3; }); return { tris: Math.round(tris), bricks: inst, brickTris: BRICK_GEO.attributes.position.count / 3 }; },
};
window.harbourStats = () => ({ blocks: blocks.size, houses: houses.length, rippling: ripple.length, doors: houses.reduce((n, h) => n + h.doors.size, 0) });
// ink: screen-space outlines from the AO pass's depth and normal buffers, so the cost does not grow
// with the town. Lines appear where depth jumps (silhouettes) or the surface turns (creases).
let ink = null;
if (gtao) {
  ink = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null }, tNormal: { value: gtao.normalTexture }, tDepth: { value: gtao.depthTexture },
      resolution: { value: new THREE.Vector2(1, 1) }, cameraNear: { value: camera.near }, cameraFar: { value: camera.far },
      inkColor: { value: new THREE.Color('#2a2430') }, strength: { value: 0.62 },
      proj: { value: new THREE.Matrix4() }, projInv: { value: new THREE.Matrix4() }, lightView: { value: new THREE.Vector3(0, 1, 0) }, contactStrength: { value: 0.32 },
    },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `#include <packing>
uniform sampler2D tDiffuse; uniform sampler2D tNormal; uniform sampler2D tDepth;
uniform vec2 resolution; uniform float cameraNear; uniform float cameraFar; uniform vec3 inkColor; uniform float strength;
uniform mat4 proj; uniform mat4 projInv; uniform vec3 lightView; uniform float contactStrength;
vec3 viewPos(vec2 uv) { vec4 v = projInv * vec4(uv * 2.0 - 1.0, texture2D(tDepth, uv).x * 2.0 - 1.0, 1.0); return v.xyz / v.w; }
// short screen-space ray march toward the sun: small things (sills, cornices, chimneys) cast crisp shadows
float contact(vec2 uv, vec3 n) {
  if (dot(n, lightView) < 0.05) return 0.0;
  vec3 p = viewPos(uv) + n * 0.01;
  for (int i = 1; i <= 6; i++) {
    vec3 q = p + lightView * (0.05 * float(i));
    vec4 c = proj * vec4(q, 1.0);
    vec2 s = c.xy / c.w * 0.5 + 0.5;
    if (s.x < 0.0 || s.x > 1.0 || s.y < 0.0 || s.y > 1.0) return 0.0;
    float dz = viewPos(s).z - q.z;
    if (dz > 0.008 && dz < 0.25) return 1.0;
  }
  return 0.0;
}
varying vec2 vUv;
float viewDepth(vec2 uv) { return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, cameraNear, cameraFar); }
void main() {
  vec4 c = texture2D(tDiffuse, vUv);
  vec2 px = 1.0 / resolution;
  float d0 = viewDepth(vUv);
  vec3 n0 = texture2D(tNormal, vUv).xyz * 2.0 - 1.0;
  float e = 0.0;
  vec2 offs[4]; offs[0] = vec2(px.x, 0.0); offs[1] = vec2(-px.x, 0.0); offs[2] = vec2(0.0, px.y); offs[3] = vec2(0.0, -px.y);
  for (int i = 0; i < 4; i++) {
    float d = viewDepth(vUv + offs[i]);
    vec3 n = texture2D(tNormal, vUv + offs[i]).xyz * 2.0 - 1.0;
    e = max(e, smoothstep(0.03, 0.09, (d - d0) / d0));
    e = max(e, smoothstep(0.42, 0.7, 1.0 - dot(n, n0)));
  }
  float fade = 1.0 - smoothstep(35.0, 110.0, d0);
  c.rgb *= 1.0 - contactStrength * contact(vUv, n0) * (1.0 - smoothstep(20.0, 45.0, d0));
  c.rgb = mix(c.rgb, inkColor, e * strength * fade);
  gl_FragColor = c;
}`,
  });
  composer.addPass(ink);
}
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0, 0.45, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  fxMat.uniforms.uScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  if (ink) ink.uniforms.resolution.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- loop ----------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = t => t * t * (3 - 2 * t);
let frame = 0;

function tick(now) {
  const t = now / 1000;
  if (timeTo) {
    const p = Math.min(1, (now - timeStart) / 1600), e = smooth(p);
    for (const k of ['top', 'horizon', 'sun', 'hs', 'hg', 'water', 'glass', 'foamCol']) cur[k].copy(timeFrom[k]).lerp(timeTo[k], e);
    cur.sunPos.copy(timeFrom.sunPos).lerp(timeTo.sunPos, e);
    for (const k of ['sunI', 'hI', 'glow', 'bloom', 'foam']) cur[k] = timeFrom[k] + (timeTo[k] - timeFrom[k]) * e;
    if (p >= 1) timeTo = null;
  }
  applyTime();
  if (!reduceMotion) water.material.uniforms.uTime.value = t;
  foamMat.opacity = cur.foam + Math.sin(t * 1.4) * 0.12;
  for (const bt of boats) {
    const ang = bt.phase + t * bt.speed;
    bt.b.position.set(Math.cos(ang) * bt.radius, WATER + 0.03 + Math.sin(t * 1.3 + bt.phase) * 0.05, Math.sin(ang) * bt.radius);
    bt.b.rotation.y = -ang + (bt.speed > 0 ? 0 : Math.PI);
    bt.b.rotation.x = Math.sin(t * 1.1 + bt.phase) * 0.05;
  }
  for (const gl of gulls) {
    const a = gl.p + t * gl.s;
    gl.g.position.set(Math.cos(a) * gl.r, gl.h + Math.sin(t * 0.7 + gl.p) * 0.6, Math.sin(a) * gl.r);
    gl.g.rotation.y = -a;
    const flap = Math.sin(t * gl.f + gl.p) * 0.45;
    gl.wl.rotation.z = flap; gl.wr.rotation.z = -flap;
  }
  const dt = Math.min(0.05, (now - (tick.last || now)) / 1000);
  tick.last = now;
  if (ripple.length) {
    let done = true;
    for (const r of ripple) {
      if (reduceMotion) continue;
      if (now < r.start) { done = false; continue; }
      const age = (now - r.start) / 1000;
      if (!r.kicked) {
        r.kicked = true;
        if (!r.full) { r.v = -2.6; sparkleAt(r.x, r.y + 1.05, r.z, 2); }
      }
      // damped spring toward full height: new pieces overshoot and settle, reshaped ones dip and rebound
      const k = r.full ? 190 : 280, c = r.full ? 12 : 16;
      for (let sub = 0; sub < 3; sub++) {
        const h = dt / 3, acc = -k * (r.s - 1) - c * r.v;
        r.v += acc * h; r.s += r.v * h;
      }
      const sy = Math.max(0.001, r.s);
      const sxz = r.full ? Math.min(1 / Math.sqrt(Math.max(sy, 0.3)), 0.22 + sy) : Math.min(1.2, Math.max(0.85, 1 / Math.sqrt(sy)));
      r.obj.scale.set(sxz, sy, sxz);
      r.obj.position.y = r.base + (r.full ? 0 : 0.06 * Math.sin(Math.min(1, age / 0.32) * Math.PI));
      const glow = (r.full ? 0.5 : 0.2) * Math.exp(-age * 5);
      for (const m of r.mats) m.emissiveIntensity = glow;
      if (age < 0.25 || Math.abs(r.s - 1) > 0.002 || Math.abs(r.v) > 0.02 || glow > 0.01) done = false;
    }
    if (done) rebuild();
  }
  updateFx(dt, t);
  const breathe = 0.82 + 0.18 * Math.sin(t * 3.4);
  ghostFade = Math.min(1, ghostFade + dt * 7);
  ghostMat.opacity = ghostBase * breathe * ghostFade;
  ghostLineMat.opacity = (0.55 + 0.35 * breathe) * ghostFade;
  controls.update();
  sun.target.position.set(0, 0, 0);
  if (shadowsDirty || ripple.length || timeTo) { renderer.shadowMap.needsUpdate = true; shadowsDirty = false; }
  if (ink) {
    ink.uniforms.proj.value.copy(camera.projectionMatrix);
    ink.uniforms.projInv.value.copy(camera.projectionMatrixInverse);
    ink.uniforms.lightView.value.copy(sun.position).sub(sun.target.position).normalize().transformDirection(camera.matrixWorldInverse);
    ink.uniforms.contactStrength.value = 0.32 * Math.min(1, cur.sunI / 2.4);
  }
  composer.render();
  requestAnimationFrame(tick);
}

blocks = load() || sampleTown(20261025);
rebuild();
requestAnimationFrame(tick);
</script>
