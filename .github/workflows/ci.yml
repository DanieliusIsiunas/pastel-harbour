name: CI

# The same gate as `npm run check`: lint, tests (fixtures, planner rules, registry, performance budget)
# and the production build, on every push and pull request.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # shared runners are about 7x slower than a laptop and noisy, so CI only catches a large slowdown
          # (1 s for the default town); the pre-commit hook keeps the tight 200 ms budget locally
          PERF_BUDGET_SCALE: '5'
      - run: npm run build
